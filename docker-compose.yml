# Local infrastructure for development (architecture 01 §4). Not for production.
#   docker compose up -d      PostgreSQL 17 (localhost:5433), Redis 7 (6379), Mailpit (1025 / UI 8025)
# Passwords below are local development defaults only; override them in your shell or a root .env.
name: medilink

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: postgres
      # Used by backend/docker/postgres/init/01-roles.sh to create the two application roles.
      MEDILINK_DB_NAME: medilink
      MEDILINK_OWNER_PASSWORD: ${MEDILINK_OWNER_PASSWORD:-medilink_owner_dev_only}
      MEDILINK_APP_PASSWORD: ${MEDILINK_APP_PASSWORD:-medilink_app_dev_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medilink"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
