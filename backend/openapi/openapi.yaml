components:
  schemas:
    ActionEnum:
      enum:
      - create
      - update
      - retire
      - restore
      - import
      type: string
      description: |-
        * `create` - Create
        * `update` - Update
        * `retire` - Retire
        * `restore` - Restore
        * `import` - Import
    ActiveFacilityRequest:
      type: object
      description: Rejects unknown fields instead of silently ignoring them.
      properties:
        facility_id:
          type: string
          format: uuid
      required:
      - facility_id
    ActorKindEnum:
      enum:
      - applicant
      - platform_admin
      - system
      type: string
      description: |-
        * `applicant` - Applicant
        * `platform_admin` - Super admin
        * `system` - System
    AdminBlock:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
      required:
      - email
      - name
      - phone
    AdminInputRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 20
    AgreementsBlock:
      type: object
      properties:
        accepted_terms_version:
          type: string
          nullable: true
        accepted_dpa_version:
          type: string
          nullable: true
        ncsa_registration_confirmed:
          type: boolean
      required:
      - accepted_dpa_version
      - accepted_terms_version
      - ncsa_registration_confirmed
    ApplicantApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        version:
          type: integer
        facility:
          $ref: '#/components/schemas/FacilityBlock'
        location:
          $ref: '#/components/schemas/LocationBlock'
        applicant:
          $ref: '#/components/schemas/ApplicantBlock'
        proposed_admin:
          $ref: '#/components/schemas/AdminBlock'
        claimed_insurer_codes:
          type: array
          items:
            type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationDocument'
        agreements:
          $ref: '#/components/schemas/AgreementsBlock'
        feedback:
          $ref: '#/components/schemas/FeedbackBlock'
        missing_for_submit:
          type: array
          items:
            type: string
        preferred_language:
          type: string
        submitted_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
      required:
      - agreements
      - applicant
      - claimed_insurer_codes
      - documents
      - facility
      - feedback
      - id
      - location
      - missing_for_submit
      - preferred_language
      - proposed_admin
      - status
      - submitted_at
      - updated_at
      - version
    ApplicantBlock:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        position:
          type: string
      required:
      - email
      - name
      - phone
      - position
    ApplicantInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        position:
          type: string
          maxLength: 120
      required:
      - email
      - name
    ApplicantPatchInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        position:
          type: string
          maxLength: 120
    ApplicationDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/DocumentKindEnum'
        insurer_code:
          type: string
          nullable: true
        number:
          type: string
        issued_on:
          type: string
          format: date
          nullable: true
        expires_on:
          type: string
          format: date
          nullable: true
        review_status:
          $ref: '#/components/schemas/ApplicationDocumentReviewStatusEnum'
        review_comment:
          type: string
        upload:
          $ref: '#/components/schemas/Upload'
      required:
      - expires_on
      - id
      - insurer_code
      - issued_on
      - kind
      - number
      - review_comment
      - review_status
      - upload
    ApplicationDocumentReviewStatusEnum:
      enum:
      - pending
      - accepted
      - needs_change
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `needs_change` - Needs change
    ApplicationEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ApplicationEventKindEnum'
        from_status:
          type: string
        to_status:
          type: string
        actor_kind:
          $ref: '#/components/schemas/ActorKindEnum'
        actor:
          allOf:
          - $ref: '#/components/schemas/Person'
          nullable: true
        note_kind:
          type: string
        note:
          type: string
        reason_code:
          type: string
        item_comments:
          type: array
          items:
            $ref: '#/components/schemas/ItemComment'
        metadata:
          type: object
          additionalProperties: {}
        occurred_at:
          type: string
          format: date-time
        occurred_on:
          type: string
          format: date
          nullable: true
      required:
      - actor
      - actor_kind
      - from_status
      - id
      - item_comments
      - kind
      - metadata
      - note
      - note_kind
      - occurred_at
      - occurred_on
      - reason_code
      - to_status
    ApplicationEventKindEnum:
      enum:
      - status_change
      - note
      - item_comments
      - document_review
      - link_sent
      - platform_edit
      type: string
      description: |-
        * `status_change` - Status change
        * `note` - Note
        * `item_comments` - Item comments
        * `document_review` - Document review
        * `link_sent` - Resume link sent
        * `platform_edit` - Edited by the platform
    ApplicationStatusEnum:
      enum:
      - draft
      - submitted
      - under_review
      - changes_requested
      - approved
      - rejected
      type: string
