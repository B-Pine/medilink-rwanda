# Local infrastructure for development (architecture 01 §4). Not for production.
#   docker compose up -d      PostgreSQL 17 (localhost:5433), Redis 7 (6379), Mailpit (1025 / UI 8025)
# Images are pinned by digest (tag kept for readability; Dependabot proposes updates).
# Passwords below are local development defaults only; override them in your shell or a root .env.
name: medilink

services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: postgres
      # Used by backend/docker/postgres/init/01-roles.sh to create the two application roles.
      MEDILINK_DB_NAME: medilink
      MEDILINK_OWNER_PASSWORD: ${MEDILINK_OWNER_PASSWORD:-medilink_owner_dev_only}
      MEDILINK_APP_PASSWORD: ${MEDILINK_APP_PASSWORD:-medilink_app_dev_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medilink"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
