openapi: 3.0.3
info:
  title: MediLink Rwanda API
  version: 0.1.0
  description: 'REST API for MediLink Rwanda. Audiences: /api/v1/staff (staff session
    cookie), /api/v1/patient (patient session cookie), /api/v1/auth (audience-neutral).
    Errors use the envelope {error: {code, message, fields, request_id}}.'
paths:
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset
      summary: Request a password reset email (always 202, even for unknown emails)
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited (per IP)
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm
      summary: Set a new password with the emailed link; revokes all sessions
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: Password changed; all sessions of the user revoked
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'validation_error: invalid/expired link or password rejected'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
  /api/v1/calendar/{token}.ics:
    get:
      operationId: calendar_feed_ics
      description: Public with the token (D-6). Facility, service, time and booking
        code only.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - booking
      responses:
        '200':
          description: iCalendar feed
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown or revoked link
  /api/v1/csrf/:
    get:
      operationId: csrf_token
      description: |-
        Returns a CSRF token and sets the CSRF cookie on the API host (ADR 0006).

        Frontends on other hosts can't read the API host's cookies, so they fetch the token here and
        send it as `X-CSRFToken` on every POST/PUT/PATCH/DELETE (with `credentials: "include"`).
        Fetch it again after any login step: signing in rotates the CSRF secret.
      summary: Get a CSRF token (and the CSRF cookie)
      tags:
      - system
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/display/{token}/:
    get:
      operationId: display_board
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - queue
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Display'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown or revoked display link
  /api/v1/health/:
    get:
      operationId: health
      description: Liveness probe. Public; never touches the database.
      summary: Service health and API version
      tags:
      - system
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/patient/auth/login/:
    post:
      operationId: patient_auth_login
      summary: Patient login; rotates the session
      tags:
      - patient-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientLoginRequest'
        required: true
      security:
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated (generic)
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited, with Retry-After
  /api/v1/patient/auth/logout/:
    post:
      operationId: patient_auth_logout
      summary: Patient logout
      tags:
      - patient-auth
      security:
      - patientSession: []
      responses:
        '204':
          description: Patient session deleted (staff session untouched)
  /api/v1/patient/auth/me/:
    get:
      operationId: patient_auth_me
      summary: Current patient account and the profiles it manages
      tags:
      - patient-auth
      security:
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMe'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated
  /api/v1/patient/auth/register/:
    post:
      operationId: patient_auth_register
      summary: 'Patient sign-up: always 202 ''check your email'' (no account enumeration);
        a new account signs in only after the emailed link is opened'
      tags:
      - patient-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRegisterRequest'
        required: true
      security:
      - patientSession: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: validation_error (never for an email that already has an account)
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
  /api/v1/patient/auth/verify-email/:
    post:
      operationId: patient_auth_verify_email
      summary: Confirm the sign-up email with the emailed link; activates and signs
        in
      tags:
      - patient-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'validation_error: invalid, expired or already used link'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
  /api/v1/patient/bills/:
    get:
      operationId: patient_bills
      summary: Bills of my profiles, newest first (PB1)
      parameters:
      - in: query
        name: has_balance
        schema:
          type: boolean
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: patient_id
        schema:
          type: string
      tags:
      - patient-bills
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPatientBillRowList'
          description: ''
  /api/v1/patient/bills/{bill_id}/:
    get:
      operationId: patient_bill_detail
      summary: One bill with lines, payments and receipts (PB2)
      parameters:
      - in: path
        name: bill_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-bills
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientBill'
          description: ''
  /api/v1/patient/bookings/:
    get:
      operationId: patient_bookings
      parameters:
      - in: query
        name: when
        schema:
          type: string
          enum:
          - past
          - upcoming
      tags:
      - booking
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
          description: ''
    post:
      operationId: patient_booking_create
      tags:
      - booking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: age_rule, sex_rule, limit_active, limit_strikes, same_day_service,
            hold_expired
  /api/v1/patient/bookings/{booking_id}/:
    get:
      operationId: patient_booking
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - booking
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/patient/bookings/{booking_id}/calendar.ics:
    get:
      operationId: patient_booking_ics
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - booking
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          description: iCalendar file
  /api/v1/patient/bookings/{booking_id}/cancel/:
    post:
      operationId: patient_booking_cancel
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - booking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Stale version
  /api/v1/patient/bookings/{booking_id}/reschedule/:
    post:
      operationId: patient_booking_reschedule
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - booking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Stale version
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Closed
  /api/v1/patient/bookings/{booking_id}/respond/:
    post:
      operationId: patient_booking_respond
      description: Accept the moved time, cancel (never a late cancellation) or choose
        another time with a hold (FR-SCH-14).
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - booking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondRequest'
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: 'The booking (for hold_id: the new one)'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Stale version
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: no_offer, hold_expired
  /api/v1/patient/calendar-feed/:
    get:
      operationId: patient_calendar_feed
      tags:
      - booking
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarFeed'
          description: ''
    post:
      operationId: patient_calendar_feed_create
      description: A new private link, shown once; the previous link stops working.
      tags:
      - booking
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarFeedCreated'
          description: ''
    delete:
      operationId: patient_calendar_feed_revoke
      tags:
      - booking
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '204':
          description: No response body
  /api/v1/patient/consents/:
    get:
      operationId: patient_consents_retrieve
      summary: Current consents and their history
      tags:
      - patient-profiles
      security:
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentState'
          description: ''
    post:
      operationId: patient_consents_create
      summary: Give or withdraw a consent (append-only)
      tags:
      - patient-profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentInputRequest'
        required: true
      security:
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
          description: ''
  /api/v1/patient/delegations/:
    get:
      operationId: patient_delegations_list
      summary: Access you granted, access you received, and pending invites
      tags:
      - patient-profiles
      security:
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delegations'
          description: ''
    post:
      operationId: patient_delegations_create
      summary: Create a one-time code to share a profile (password required)
      tags:
      - patient-profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreateRequest'
        required: true
      security:
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
          description: ''
  /api/v1/patient/delegations/{object_id}/revoke/:
    post:
      operationId: patient_delegations_revoke
      summary: End a link or cancel a pending invite
      parameters:
      - in: path
        name: object_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      security:
      - patientSession: []
      responses:
        '204':
          description: No response body
  /api/v1/patient/delegations/accept/:
    post:
      operationId: patient_delegations_accept
      summary: Accept a code someone shared with you
      tags:
      - patient-profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      security:
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSummary'
          description: ''
  /api/v1/patient/dependents/:
    post:
      operationId: patient_dependents_create
      summary: Add a child (guardian) or an adult who agreed (delegate); Idempotency-Key
      tags:
      - patient-profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependentRequest'
        required: true
      security:
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSummary'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: age, limit or consent version
  /api/v1/patient/disputes/:
    get:
      operationId: patient_disputes
      summary: Disputes of my profiles, newest first (P1)
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: patient_id
        schema:
          type: string
      tags:
      - disputes
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DisputeRow'
          description: ''
    post:
      operationId: patient_dispute_raise
      summary: Raise a dispute from what went wrong (P1)
      tags:
      - disputes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaiseRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDispute'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not your subject
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: A dispute about this is already open
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 5 open disputes
  /api/v1/patient/disputes/{dispute_id}/:
    get:
      operationId: patient_dispute
      summary: Dispute thread and deadlines (P2); no internal notes
      parameters:
      - in: path
        name: dispute_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - disputes
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDispute'
          description: ''
  /api/v1/patient/disputes/{dispute_id}/accept/:
    post:
      operationId: patient_dispute_accept
      summary: Accept the decision (P4)
      parameters:
      - in: path
        name: dispute_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - disputes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeVersionRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDispute'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Stale version: reload and try again'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not now
  /api/v1/patient/disputes/{dispute_id}/disagreement/:
    post:
      operationId: patient_dispute_statement
      summary: My disagreement statement, attached to the record (P5, FR-DSP-07)
      parameters:
      - in: path
        name: dispute_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - disputes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDispute'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Only after a refused correction
  /api/v1/patient/disputes/{dispute_id}/escalate/:
    post:
      operationId: patient_dispute_escalate
      summary: 'Disagree within 14 days: MediLink decides (P4)'
      parameters:
      - in: path
        name: dispute_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - disputes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeVersionRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDispute'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Stale version: reload and try again'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not now
  /api/v1/patient/disputes/{dispute_id}/messages/:
    post:
      operationId: patient_dispute_message
      summary: Reply in the thread (P3)
      parameters:
      - in: path
        name: dispute_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - disputes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInputRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDispute'
          description: ''
  /api/v1/patient/disputes/{dispute_id}/reopen/:
    post:
      operationId: patient_dispute_reopen
      summary: Reopen once within 30 days with new facts (P4)
      parameters:
      - in: path
        name: dispute_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - disputes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeVersionRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDispute'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Stale version: reload and try again'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not now
  /api/v1/patient/documents/:
    get:
      operationId: patient_documents
      summary: Documents of my profiles, newest first (D4)
      parameters:
      - in: query
        name: kind
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: patient_id
        schema:
          type: string
      tags:
      - patient-documents
      security:
      - staffSession: []
      - patientSession: []
