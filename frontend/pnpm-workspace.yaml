packages:
  - apps/*
  - packages/*

# One version of each shared dependency across the workspace (`catalog:` in package.json).
catalog:
  "@eslint/js": ^10.0.1
  "@fontsource-variable/figtree": ^5.3.0
  "@fontsource-variable/inter": ^5.3.0
  "@hookform/resolvers": ~5.9.1
  "@phosphor-icons/react": ^2.1.10
  "@radix-ui/react-dropdown-menu": ^2.2.1
  "@radix-ui/react-slot": ^1.5.0
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.104.3
  "@testing-library/dom": ^10.4.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.8
  "@types/node": ^26.6.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  axe-core: ^4.14.0
  eslint: ^9.39.5
  i18next: ^26.4.7
  jsdom: ^30.1.3
  msw: ^2.15.0
  prettier: ^3.9.10
  qrcode.react: ^4.2.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-hook-form: ^7.90.0
  react-i18next: ~17.0.18
  react-router: ^8.4.0
  tailwindcss: ^4.3.3
  # Stay on 6.x until typescript-eslint supports TS 7 (typescript-eslint#10940; issue #43).
  typescript: ~6.0.3
  vite: ^8.3.4
  vite-plugin-pwa: ^2.0.0
  vitest: ^5.0.5
  vitest-axe: ^0.1.0
  workbox-build: ^7.4.1
  workbox-window: ^7.4.1
  zod: ^4.6.7

# Dependency build scripts are denied by default; msw's postinstall only copies the worker,
# which we do explicitly (public/mockServiceWorker.js is committed).
allowBuilds:
  msw: false
