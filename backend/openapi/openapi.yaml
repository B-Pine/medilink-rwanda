            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown purpose, wrong audience, file type or size
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed to upload for this purpose
  /api/v1/patient/uploads/{upload_id}/:
    get:
