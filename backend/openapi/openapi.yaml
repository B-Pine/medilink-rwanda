openapi: 3.0.3
info:
  title: MediLink Rwanda API
  version: 0.1.0
  description: 'REST API for MediLink Rwanda. Audiences: /api/v1/staff (staff session
    cookie), /api/v1/patient (patient session cookie), /api/v1/auth (audience-neutral).
    Errors use the envelope {error: {code, message, fields, request_id}}.'
paths:
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset
      summary: Request a password reset email (always 202, even for unknown emails)
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited (per IP)
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm
      summary: Set a new password with the emailed link; revokes all sessions
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: Password changed; all sessions of the user revoked
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'validation_error: invalid/expired link or password rejected'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
  /api/v1/csrf/:
    get:
      operationId: csrf_token
      description: |-
        Returns a CSRF token and sets the CSRF cookie on the API host (ADR 0006).

        Frontends on other hosts can't read the API host's cookies, so they fetch the token here and
        send it as `X-CSRFToken` on every POST/PUT/PATCH/DELETE (with `credentials: "include"`).
        Fetch it again after any login step: signing in rotates the CSRF secret.
      summary: Get a CSRF token (and the CSRF cookie)
      tags:
      - system
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/health/:
    get:
      operationId: health
      description: Liveness probe. Public; never touches the database.
      summary: Service health and API version
      tags:
      - system
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/patient/auth/login/:
    post:
      operationId: patient_auth_login
      summary: Patient login; rotates the session
      tags:
      - patient-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientLoginRequest'
        required: true
      security:
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated (generic)
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited, with Retry-After
  /api/v1/patient/auth/logout/:
    post:
      operationId: patient_auth_logout
      summary: Patient logout
      tags:
      - patient-auth
      security:
      - patientSession: []
      responses:
        '204':
          description: Patient session deleted (staff session untouched)
  /api/v1/patient/auth/me/:
    get:
      operationId: patient_auth_me
      summary: Current patient account and the profiles it manages
      tags:
      - patient-auth
      security:
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMe'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated
  /api/v1/patient/auth/register/:
    post:
      operationId: patient_auth_register
      summary: Patient sign-up (creates account, self profile and consents) and sign-in
      tags:
      - patient-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRegisterRequest'
        required: true
      security:
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: validation_error
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
  /api/v1/patient/uploads/:
    post:
      operationId: patient_uploads_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Repeating an upload with the same key returns the original upload.
      tags:
      - uploads
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadCreateRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown purpose, wrong audience, file type or size
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed to upload for this purpose
  /api/v1/patient/uploads/{upload_id}/:
    get:
      operationId: patient_uploads_retrieve
      parameters:
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - uploads
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
  /api/v1/patient/uploads/{upload_id}/download-links/:
    post:
      operationId: patient_uploads_download_links_create
      parameters:
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - uploads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadLinkRequestRequest'
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLink'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The file isn't clean (yet)
  /api/v1/staff/auth/active-facility/:
    post:
      operationId: staff_auth_active_facility
      summary: Switch the active facility; rotates the session; audit-logged
      tags:
      - staff-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveFacilityRequest'
        required: true
      security:
      - staffSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated or mfa_required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_found: not an active member of this facility'
  /api/v1/staff/auth/login/:
    post:
      operationId: staff_auth_login
      description: 'Step 1 of staff sign-in. Never returns an authenticated session:
        MFA is mandatory.'
      summary: Staff login (password step); rotates the session
      tags:
      - staff-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
        required: true
      security:
      - staffSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_authenticated (generic: wrong email/password or not a
            staff account)'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited, with Retry-After
  /api/v1/staff/auth/logout/:
    post:
      operationId: staff_auth_logout
      summary: Staff logout
      tags:
      - staff-auth
      security:
      - staffSession: []
      responses:
        '204':
          description: Staff session deleted (patient session untouched)
  /api/v1/staff/auth/me/:
    get:
      operationId: staff_auth_me
      summary: Current staff user, memberships and permissions for the active facility
      tags:
      - staff-auth
      security:
      - staffSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMe'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated or mfa_required
  /api/v1/staff/auth/mfa/confirm/:
    post:
      operationId: staff_auth_mfa_confirm
      summary: Confirm TOTP enrolment; returns 10 recovery codes once and signs in
      tags:
      - staff-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      security:
      - staffSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaConfirmResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'validation_error: wrong code'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not in the mfa_setup_required state
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
  /api/v1/staff/auth/mfa/setup/:
    post:
      operationId: staff_auth_mfa_setup
      summary: Start TOTP enrolment (only in the mfa_setup_required state)
      tags:
      - staff-auth
      security:
      - staffSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not in the mfa_setup_required state
  /api/v1/staff/auth/mfa/verify/:
    post:
      operationId: staff_auth_mfa_verify
      summary: Verify the second factor (TOTP code or recovery code); rotates the
        session
      tags:
      - staff-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      security:
      - staffSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'validation_error: wrong code / recovery code'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not in the mfa_required state
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited, with Retry-After
  /api/v1/staff/uploads/:
    post:
      operationId: staff_uploads_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Repeating an upload with the same key returns the original upload.
      tags:
      - uploads
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadCreateRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown purpose, wrong audience, file type or size
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not allowed to upload for this purpose
  /api/v1/staff/uploads/{upload_id}/:
    get:
      operationId: staff_uploads_retrieve
      parameters:
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - uploads
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
  /api/v1/staff/uploads/{upload_id}/download-links/:
    post:
      operationId: staff_uploads_download_links_create
      parameters:
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - uploads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadLinkRequestRequest'
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLink'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The file isn't clean (yet)
components:
  schemas:
    ActiveFacilityRequest:
      type: object
      description: Rejects unknown fields instead of silently ignoring them.
      properties:
        facility_id:
          type: string
          format: uuid
      required:
      - facility_id
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    DispositionEnum:
      enum:
      - inline
      - attachment
      type: string
      description: |-
        * `inline` - inline
        * `attachment` - attachment
    DownloadLink:
      type: object
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        disposition:
          $ref: '#/components/schemas/DispositionEnum'
      required:
      - disposition
      - expires_at
      - url
    DownloadLinkRequestRequest:
      type: object
      properties:
        disposition:
          allOf:
          - $ref: '#/components/schemas/DispositionEnum'
          default: inline
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. validation_error.
        message:
          type: string
          description: Localised human-readable message.
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field name -> messages. Empty object when not a validation
            error.
        request_id:
          type: string
          description: Same value as the X-Request-ID header.
      required:
      - code
      - fields
      - message
      - request_id
    FacilitySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        facility_type:
          $ref: '#/components/schemas/FacilityTypeEnum'
      required:
      - facility_type
      - id
      - name
      - slug
    FacilityTypeEnum:
      enum:
      - health_post
      - health_center
      - district_hospital
      - provincial_hospital
      - referral_hospital
      - private_clinic
      - polyclinic
      - private_hospital
      - dental_clinic
      - eye_clinic
      - diagnostic_center
      type: string
      description: |-
        * `health_post` - Health post
        * `health_center` - Health center
        * `district_hospital` - District hospital
        * `provincial_hospital` - Provincial hospital
        * `referral_hospital` - Referral / teaching hospital
        * `private_clinic` - Private clinic
        * `polyclinic` - Polyclinic
        * `private_hospital` - Private hospital
        * `dental_clinic` - Dental clinic
        * `eye_clinic` - Eye clinic
        * `diagnostic_center` - Diagnostic center
    Health:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
      required:
      - status
      - version
    LanguageEnum:
      enum:
      - rw
      - en
      - fr
      type: string
      description: |-
        * `rw` - Kinyarwanda
        * `en` - English
        * `fr` - Français
    LoginResult:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/LoginStatusEnum'
        user:
          allOf:
          - $ref: '#/components/schemas/StaffMe'
          nullable: true
      required:
      - status
      - user
    LoginStatusEnum:
      enum:
      - authenticated
      - mfa_required
      - mfa_setup_required
      type: string
      description: |-
        * `authenticated` - authenticated
        * `mfa_required` - mfa_required
        * `mfa_setup_required` - mfa_setup_required
    Membership:
      type: object
      properties:
        facility:
          $ref: '#/components/schemas/FacilitySummary'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleCodeEnum'
      required:
      - facility
      - roles
    MfaCodeRequest:
      type: object
      description: Rejects unknown fields instead of silently ignoring them.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 16
          pattern: ^\s*\d{6,8}\s*$
      required:
      - code
    MfaConfirmResult:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/LoginStatusEnum'
        user:
          $ref: '#/components/schemas/StaffMe'
        recovery_codes:
          type: array
          items:
            type: string
          description: Shown once. Stored hashed; each works once.
      required:
      - recovery_codes
      - status
      - user
    MfaSetup:
      type: object
      properties:
        otpauth_uri:
          type: string
        secret:
          type: string
          description: Base32 secret for manual entry.
      required:
      - otpauth_uri
      - secret
    MfaVerifyRequest:
      type: object
      description: Rejects unknown fields instead of silently ignoring them.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 16
          pattern: ^\s*\d{6,8}\s*$
        recovery_code:
          type: string
          minLength: 1
          maxLength: 32
    PasswordResetConfirmRequest:
      type: object
      description: Rejects unknown fields instead of silently ignoring them.
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 128
        token:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - new_password
      - token
      - uid
    PasswordResetRequest:
      type: object
      description: Rejects unknown fields instead of silently ignoring them.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    PatientLoginRequest:
      type: object
      description: Rejects unknown fields instead of silently ignoring them.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - email
      - password
    PatientMe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        preferred_language:
          $ref: '#/components/schemas/LanguageEnum'
        email_verified:
          type: boolean
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/PatientProfile'
      required:
      - email
      - email_verified
      - full_name
      - id
      - preferred_language
      - profiles
    PatientProfile:
      type: object
      properties:
        patient_id:
          type: string
          format: uuid
        display_name:
          type: string
        relationship:
          $ref: '#/components/schemas/RelationshipEnum'
      required:
      - display_name
      - patient_id
      - relationship
    PatientRegisterRequest:
      type: object
      description: Rejects unknown fields instead of silently ignoring them.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
        preferred_language:
          $ref: '#/components/schemas/LanguageEnum'
        accepted_terms_version:
          type: string
          minLength: 1
          maxLength: 32
        accepted_privacy_version:
          type: string
          minLength: 1
          maxLength: 32
        research_consent:
          type: boolean
      required:
      - accepted_privacy_version
      - accepted_terms_version
      - email
      - full_name
      - password
      - preferred_language
      - research_consent
    RelationshipEnum:
      enum:
      - self
      - guardian
      - delegate
      type: string
      description: |-
        * `self` - Self
        * `guardian` - Guardian
        * `delegate` - Delegate
    RoleCodeEnum:
      enum:
      - facility_admin
      - receptionist
      - doctor
      - pharmacist
      type: string
      description: |-
        * `facility_admin` - Facility admin
        * `receptionist` - Receptionist
        * `doctor` - Doctor / clinician
        * `pharmacist` - Pharmacist
    StaffLoginRequest:
      type: object
      description: Rejects unknown fields instead of silently ignoring them.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
      required:
      - email
      - password
    StaffMe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        preferred_language:
          $ref: '#/components/schemas/LanguageEnum'
        is_platform_admin:
          type: boolean
        mfa_enabled:
          type: boolean
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        active_facility_id:
          type: string
          format: uuid
          nullable: true
        permissions:
          type: array
          items:
            type: string
          description: Permission codes for the active facility.
      required:
      - active_facility_id
      - email
      - full_name
      - id
      - is_platform_admin
      - memberships
      - mfa_enabled
      - permissions
      - preferred_language
    Upload:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        purpose:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/UploadStatusEnum'
        rejection_reason:
          type: string
          nullable: true
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        original_filename:
          type: string
          readOnly: true
        sha256:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        scanned_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_attached:
          type: boolean
      required:
      - content_type
      - created_at
      - id
      - is_attached
      - original_filename
      - purpose
      - rejection_reason
      - scanned_at
      - sha256
      - size_bytes
      - status
    UploadCreateRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        purpose:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - file
      - purpose
    UploadStatusEnum:
      enum:
      - pending
      - clean
      - infected
      - rejected
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `clean` - Clean
        * `infected` - Infected
        * `rejected` - Rejected
        * `failed` - Failed
  securitySchemes:
    patientSession:
      type: apiKey
      in: cookie
      name: ml_patient
      description: Patient session cookie (__Host-ml_patient in production). Unsafe
        methods also need the X-CSRFToken header.
    staffSession:
      type: apiKey
      in: cookie
      name: ml_staff
      description: Staff session cookie (__Host-ml_staff in production). Unsafe methods
        also need the X-CSRFToken header.
