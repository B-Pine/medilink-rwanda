openapi: 3.0.3
info:
  title: MediLink Rwanda API
  version: 0.1.0
  description: 'REST API for MediLink Rwanda. Audiences: /api/v1/staff (staff session
    cookie), /api/v1/patient (patient session cookie), /api/v1/auth (audience-neutral).
    Errors use the envelope {error: {code, message, fields, request_id}}.'
paths:
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset
      summary: Request a password reset email (always 202, even for unknown emails)
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited (per IP)
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm
      summary: Set a new password with the emailed link; revokes all sessions
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: Password changed; all sessions of the user revoked
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'validation_error: invalid/expired link or password rejected'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
  /api/v1/csrf/:
    get:
      operationId: csrf_token
      description: |-
        Returns a CSRF token and sets the CSRF cookie on the API host (ADR 0006).

        Frontends on other hosts can't read the API host's cookies, so they fetch the token here and
        send it as `X-CSRFToken` on every POST/PUT/PATCH/DELETE (with `credentials: "include"`).
        Fetch it again after any login step: signing in rotates the CSRF secret.
      summary: Get a CSRF token (and the CSRF cookie)
      tags:
      - system
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/display/{token}/:
    get:
      operationId: display_board
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - queue
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Display'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown or revoked display link
  /api/v1/health/:
    get:
      operationId: health
      description: Liveness probe. Public; never touches the database.
      summary: Service health and API version
      tags:
      - system
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/patient/auth/login/:
    post:
      operationId: patient_auth_login
      summary: Patient login; rotates the session
      tags:
      - patient-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientLoginRequest'
        required: true
      security:
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated (generic)
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited, with Retry-After
  /api/v1/patient/auth/logout/:
    post:
      operationId: patient_auth_logout
      summary: Patient logout
      tags:
      - patient-auth
      security:
      - patientSession: []
      responses:
        '204':
          description: Patient session deleted (staff session untouched)
  /api/v1/patient/auth/me/:
    get:
      operationId: patient_auth_me
      summary: Current patient account and the profiles it manages
      tags:
      - patient-auth
      security:
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMe'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated
  /api/v1/patient/auth/register/:
    post:
      operationId: patient_auth_register
      summary: Patient sign-up (creates account, self profile and consents) and sign-in
      tags:
      - patient-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRegisterRequest'
        required: true
      security:
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: validation_error
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
  /api/v1/patient/bookings/:
    get:
      operationId: patient_bookings
      parameters:
      - in: query
        name: when
        schema:
          type: string
          enum:
          - past
          - upcoming
      tags:
      - booking
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
          description: ''
    post:
      operationId: patient_booking_create
      tags:
      - booking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: age_rule, sex_rule, limit_active, limit_strikes, same_day_service,
            hold_expired
  /api/v1/patient/bookings/{booking_id}/:
    get:
      operationId: patient_booking
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - booking
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/patient/bookings/{booking_id}/calendar.ics:
    get:
      operationId: patient_booking_ics
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - booking
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          description: iCalendar file
  /api/v1/patient/bookings/{booking_id}/cancel/:
    post:
      operationId: patient_booking_cancel
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - booking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Stale version
  /api/v1/patient/bookings/{booking_id}/reschedule/:
    post:
      operationId: patient_booking_reschedule
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - booking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Stale version
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Closed
  /api/v1/patient/consents/:
    get:
      operationId: patient_consents_retrieve
      summary: Current consents and their history
      tags:
      - patient-profiles
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentState'
          description: ''
    post:
      operationId: patient_consents_create
      summary: Give or withdraw a consent (append-only)
      tags:
      - patient-profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentInputRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
          description: ''
  /api/v1/patient/delegations/:
    get:
      operationId: patient_delegations_list
      summary: Access you granted, access you received, and pending invites
      tags:
      - patient-profiles
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delegations'
          description: ''
    post:
      operationId: patient_delegations_create
      summary: Create a one-time code to share a profile (password required)
      tags:
      - patient-profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreateRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
          description: ''
  /api/v1/patient/delegations/{object_id}/revoke/:
    post:
      operationId: patient_delegations_revoke
      summary: End a link or cancel a pending invite
      parameters:
      - in: path
        name: object_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '204':
          description: No response body
  /api/v1/patient/delegations/accept/:
    post:
      operationId: patient_delegations_accept
      summary: Accept a code someone shared with you
      tags:
      - patient-profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSummary'
          description: ''
  /api/v1/patient/dependents/:
    post:
      operationId: patient_dependents_create
      summary: Add a child (guardian) or an adult who agreed (delegate)
      tags:
      - patient-profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependentRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSummary'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: age or limit rules
  /api/v1/patient/holds/{hold_id}/:
    delete:
      operationId: patient_hold_release
      parameters:
      - in: path
        name: hold_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - booking
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '204':
          description: No response body
  /api/v1/patient/insurance-profiles/{profile_id}/:
    patch:
      operationId: patient_insurance_update
      summary: Edit an insurance card
      parameters:
      - in: path
        name: profile_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInsuranceUpdateRequest'
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuranceProfile'
          description: ''
  /api/v1/patient/insurance-profiles/{profile_id}/card-images/:
    post:
      operationId: patient_insurance_card_upload
      summary: Add a photo of the card (S1 upload pipeline)
      parameters:
      - in: path
        name: profile_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CardImageRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuranceProfile'
          description: ''
  /api/v1/patient/insurance-profiles/{profile_id}/card-images/{side}/download-links/:
    post:
      operationId: patient_insurance_card_link
      summary: A 5-minute link to a card photo
      parameters:
      - in: path
        name: profile_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: side
        schema:
          type: string
        required: true
      tags:
      - patient-profiles
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          description: '{url, expires_at}'
  /api/v1/patient/insurance-profiles/{profile_id}/deactivate/:
    post:
      operationId: patient_insurance_deactivate
      summary: Stop using a card (kept for history)
      parameters:
      - in: path
        name: profile_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuranceProfile'
          description: ''
  /api/v1/patient/profiles/:
    get:
      operationId: patient_profiles_list
      summary: 'Profiles of this account: self first, then dependents and delegations'
      tags:
      - patient-profiles
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileSummary'
          description: ''
  /api/v1/patient/profiles/{patient_id}/:
    get:
      operationId: patient_profiles_retrieve
      summary: A profile
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfileDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_found
    patch:
      operationId: patient_profiles_update
      summary: 'Edit a profile (names, birth date and sex: self or guardian)'
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfileDetail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: conflict
  /api/v1/patient/profiles/{patient_id}/{kind}/:
    post:
      operationId: patient_health_item_create
      summary: Add an allergy, condition or medicine (unverified until a clinician
        checks)
      parameters:
      - in: path
        name: kind
        schema:
          type: string
        required: true
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllergyInputRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthItem'
          description: ''
  /api/v1/patient/profiles/{patient_id}/{kind}/{item_id}/entered-in-error/:
    post:
      operationId: patient_health_item_entered_in_error
      summary: Remove an item you added by mistake
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthItem'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: verified by a clinician
  /api/v1/patient/profiles/{patient_id}/access-history/:
    get:
      operationId: patient_access_history
      summary: Who opened or changed this profile
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessHistoryItem'
          description: ''
  /api/v1/patient/profiles/{patient_id}/health-profile/:
    get:
      operationId: patient_health_profile
      summary: Allergies, conditions and medicines
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthProfile'
          description: ''
  /api/v1/patient/profiles/{patient_id}/identifiers/:
    get:
      operationId: patient_identifiers_list
      summary: Identity documents (masked)
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Identifier'
          description: ''
    post:
      operationId: patient_identifiers_create
      summary: Add an identity document (a verified one changes only at reception)
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierInputRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identifier'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: used by another patient
  /api/v1/patient/profiles/{patient_id}/identifiers/{identifier_id}/reveal/:
    post:
      operationId: patient_identifiers_reveal
      summary: Show the full number of your own document
      parameters:
      - in: path
        name: identifier_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reveal'
          description: ''
  /api/v1/patient/profiles/{patient_id}/insurance-profiles/:
    get:
      operationId: patient_insurance_list
      summary: Insurance cards, active first
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InsuranceProfile'
          description: ''
    post:
      operationId: patient_insurance_create
      summary: Add an insurance card
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - patient-profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsuranceInputRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuranceProfile'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: same card exists
  /api/v1/patient/record-claims/:
    post:
      operationId: patient_record_claims_create
      summary: Claim a record a facility created for you
      tags:
      - patient-profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCreateRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordClaim'
          description: ''
        '422':
