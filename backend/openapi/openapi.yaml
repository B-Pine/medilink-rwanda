          description: validation_error
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
  /api/v1/patient/uploads/:
    post:
      operationId: patient_uploads_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Repeating an upload with the same key returns the original upload.
      tags:
      - uploads
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadCreateRequest'
        required: true
      security:
      - staffSession: []
      - patientSession: []
      responses:
        '201':
