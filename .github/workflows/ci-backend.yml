# Backend CI (docs/security/09 §3): lint, types, tests on PostgreSQL as the restricted app role,
# coverage gates, OpenAPI drift, Django deploy check on production settings, dependency audit, and
# migrations reversed and re-applied (testing strategy §3.5).
name: ci-backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash = "bash --noprofile --norc -eo pipefail": a failing command in a pipe fails the step.
    shell: bash
    working-directory: backend

jobs:
  test:
    name: Lint, test, deploy check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_READ_DOT_ENV: "false"
      # CI-only credentials for the throwaway service container (not secrets).
      DATABASE_URL: postgres://medilink_app:app_ci_only@127.0.0.1:5432/medilink
      DATABASE_OWNER_URL: postgres://medilink_owner:owner_ci_only@127.0.0.1:5432/medilink
      DATABASE_APP_ROLE: medilink_app
      CACHE_URL: redis://127.0.0.1:6379/1
      CHANNEL_LAYER_URL: redis://127.0.0.1:6379/2
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
    steps:
      # Third-party actions are pinned by commit SHA (security 09 §2).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies (hash-checked lock file)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/dev.txt
          python -m pip check

      - name: Create database roles (owner + restricted app role)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres_ci_only
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          MEDILINK_OWNER_PASSWORD: owner_ci_only
          MEDILINK_APP_PASSWORD: app_ci_only
        run: bash docker/postgres/init/01-roles.sh

      - name: Ruff (lint, incl. bandit rules) and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy .

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate (as owner) and verify the audit chain (as app role)
        run: |
          python manage.py migrate --noinput
          python manage.py verify_audit_chain

      - name: Tests (PostgreSQL, RLS, run as the app role)
        run: pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Coverage gate (>= 95% for authz, >= 90% for core and every other app)
        run: |
          # authz: security 09 §3 and testing strategy §3.1. Every app is checked even after a
          # failure, so the log shows all of them.
          failed=0
          for app in authz:95 core:90 accounts:90 tenancy:90 audit:90 uploads:90 masterdata:90 onboarding:90 patients:90 facilities:90 scheduling:90 billing:90 visits:90 notifications:90 clinical:90 support:90 pharmacy:90 documents:90; do
            name="${app%%:*}" floor="${app##*:}"
            echo "== medilink/$name (>= $floor%)"
            python -m coverage report --include="medilink/$name/*" --fail-under="$floor" | tail -1 || failed=1
          done
          exit "$failed"

      - name: OpenAPI schema is valid and committed
        run: |
          python manage.py spectacular --validate --fail-on-warn --file "$RUNNER_TEMP/openapi.yaml"
          diff -u openapi/openapi.yaml "$RUNNER_TEMP/openapi.yaml"

      - name: Django deploy check (production settings, dummy values)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-dummy-${{ github.run_id }}-not-a-real-secret-Zx8qL2mN5pR7tV9wY1aB3cD
          DJANGO_ALLOWED_HOSTS: api.medilink.rw
          DATABASE_URL: postgres://medilink_app:dummy@db.invalid:5432/medilink
          CORS_ALLOWED_ORIGINS: https://staff.medilink.rw,https://medilink.rw
          EMAIL_URL: smtp+tls://mailer:dummy@smtp.invalid:587
          UPLOADS_SCANNER: clamd
          UPLOADS_STORAGE: s3
          UPLOADS_DOWNLOAD_BASE_URL: https://files.medilink.rw
          UPLOADS_S3_REGION: ci-dummy-region
          PLATFORM_ALLOWED_NETWORKS: 10.0.0.0/8
          # S9: dummy VAPID keys (check --deploy refuses push without keys, notifications.E010)
          WEB_PUSH_VAPID_PUBLIC_KEY: BDummyPublicKeyForTheDeployCheckOnly
          WEB_PUSH_VAPID_PRIVATE_KEY: dummy-private-key-for-the-deploy-check-only
        run: |
          # Random 32-byte keys for this check only (S3 patient identifier encryption)
          key() { python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())"; }
          export MEDILINK_FIELD_KEYS="1:$(key)" MEDILINK_BLIND_INDEX_KEYS="1:$(key)" MFA_SECRET_KEYS="1:$(key)"
          python manage.py check --deploy --fail-level WARNING

      - name: pip-audit (known vulnerabilities in locked dependencies)
        run: pip-audit --strict --require-hashes --disable-pip -r requirements/prod.txt -r requirements/dev.txt

  migrations:
    name: Migrations reverse and re-apply
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_READ_DOT_ENV: "false"
      # CI-only credentials for the throwaway service container (not secrets).
      DATABASE_URL: postgres://medilink_app:app_ci_only@127.0.0.1:5432/medilink
      DATABASE_OWNER_URL: postgres://medilink_owner:owner_ci_only@127.0.0.1:5432/medilink
      DATABASE_APP_ROLE: medilink_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies (hash-checked lock file)
        run: python -m pip install --require-hashes --no-deps -r requirements/dev.txt

      - name: Create database roles (owner + restricted app role)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres_ci_only
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          MEDILINK_OWNER_PASSWORD: owner_ci_only
          MEDILINK_APP_PASSWORD: app_ci_only
        run: bash docker/postgres/init/01-roles.sh

      - name: Migrate an empty database
        run: python manage.py migrate --noinput

      - name: Reverse each app's latest migration and re-apply (NFR-OPS-08)
        run: python scripts/check_migrations_reversible.py

      - name: Schema matches the models after the round trip
        run: python manage.py makemigrations --check --dry-run

  image:
    name: Build container image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (no push)
        run: docker build --tag medilink-api:ci .
      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id medilink-api:ci -u)" = "10001"
