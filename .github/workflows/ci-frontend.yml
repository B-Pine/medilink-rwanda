name: CI · frontend

# Lint, typecheck, test and build the frontend workspace (frontend/): staff-web and patient-web.
# Third-party actions are pinned by commit SHA (docs/security/09-secure-development-lifecycle.md).

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # Builds are static; the API origin is baked in at build time (ADR 0006).
      VITE_API_BASE_URL: https://api.medilink.rw
      VITE_USE_MOCKS: "false"
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm (version from frontend/package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, component and accessibility tests
        run: pnpm test

      - name: Build staff-web and patient-web (incl. PWA check)
        run: pnpm build

      - name: Audit production dependencies (informational in Sprint 0)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
