# gitleaks configuration (used by .github/workflows/security.yml, which scans the full history).
# Keep allowlists as narrow as possible: a specific value in a specific file, never a whole rule.
title = "MediLink Rwanda gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic values in the log-redaction test (B15) that prove secrets are redacted; not real secrets"
condition = "AND"
paths = ['''^backend/tests/test_b15_logging_env\.py$''']
regexes = ['''abcdef123456''', '''hunter2-secret''']

[[allowlists]]
description = "Synthetic passphrase used by frontend tests against the MSW mocks; not a real credential"
condition = "AND"
paths = ['''^frontend/.*\.test\.tsx?$''']
regexes = ['''a-long-passphrase-2026''']

[[allowlists]]
description = "Random object-storage key (a UUID) in the S3 storage test (S1-B9); not a secret"
condition = "AND"
paths = ['''^backend/tests/uploads/test_processing\.py$''']
regexes = ['''0b8f4c56-8f1e-4a55-9c55-4f0c5a6f1e01''']

[[allowlists]]
description = "Synthetic sign-up passphrase in the S3 patient API test; not a real credential"
condition = "AND"
paths = ['''^backend/tests/patients/test_patient_api\.py$''']
regexes = ['''a-Long-and-unusual-passphrase-42''']
